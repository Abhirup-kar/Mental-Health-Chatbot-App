{% extends "base.html" %}
{% block title %}Log In — SereneMind{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <span class="pill-badge">Welcome Back</span>
      <h1>Log in to your account</h1>
      <p>Continue chatting with your supportive Mental Health Chatbot.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          value="{{ username or '' }}"
          placeholder="Enter your username"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
          <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
        </div>
      </div>

      <div id="authClientError" class="client-error" role="alert" hidden></div>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer-link">
      New to SereneMind? <a href="{{ url_for('auth.register') }}">Register for an account</a>
    </p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
